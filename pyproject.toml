[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hsr-currency-wars-ai"
version = "0.1.0"
description = "货币战争研究工具"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
