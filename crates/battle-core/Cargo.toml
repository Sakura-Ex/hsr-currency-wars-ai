[package]
name = "hcwa-battle-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false
description = "Deterministic, explicit-input battle simulation and Monte Carlo evaluation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand_chacha = "=0.9.0"
rand_core = "=0.9.3"

[[bin]]
name = "hcwa-battle"
path = "src/main.rs"
